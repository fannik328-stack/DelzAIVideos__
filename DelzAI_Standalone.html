async function prepareReferenceImage(file){
if(!file||!file.type||!file.type.startsWith('image/'))throw new Error('Выберите файл изображения');
if(file.size>20*1024*1024)throw new Error('Изображение больше 20 МБ');
const source=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(new Error('Не удалось прочитать изображение'));r.readAsDataURL(file)});
const img=await new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=()=>reject(new Error('Формат изображения не поддерживается'));im.src=source});
const max=1280,scale=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));
const ctx=canvas.getContext('2d');if(!ctx)throw new Error('Не удалось обработать изображение');ctx.drawImage(img,0,0,canvas.width,canvas.height);
return canvas.toDataURL('image/jpeg',0.76);
}
refpick.onchange=async()=>{const files=Array.from(refpick.files||[]).filter(f=>f.type.startsWith('image/'));let added=0;for(const file of files){if((S.referenceImages||[]).length>=6)break;try{const data=await prepareReferenceImage(file);S.referenceImages=S.referenceImages||[];S.referenceImages.push({name:file.name,data});added++;}catch(e){toast(e.message||'Не удалось добавить изображение')}}refpick.value='';create();if(added)toast('Добавлено изображений: '+added);};

<h1 style="font-size:28px;margin-top:22px" id="st">${esc(title)}</h1><p class="sub">Задача продолжится на сервере, даже если закрыть приложение</p>
<div class="bar"><i id="pb"></i></div><button class="out" id="jobsback">Открыть все генерации</button></div>`;
const pb=document.getElementById('pb');setTimeout(()=>pb.style.width='6%',50);v.querySelector('#jobsback').onclick=()=>{S.tab='lib';shell()}}
function updateJobView(job){if(S.tab!=='lib'||S.curJobId!==job.localId)return;const st=document.getElementById('job-status'),pb=document.getElementById('pb');if(st)st.textContent=job.message||job.statusLabel||'Генерируется…';if(pb)pb.style.width=Math.max(5,Math.min(100,job.progress||5))+'%'}
function renderGenError(e){const v=document.getElementById('v');
v.innerHTML=`<div style="animation:in .45s both;padding-top:40px;text-align:center"><div style="display:inline-block">${logo(70)}</div><h1 style="font-size:26px;margin:16px 0 8px">Не получилось</h1><p class="sub">${esc(cleanMsg(e&&e.message||'Неизвестная ошибка')).slice(0,240)}</p><button class="btn" id="rt">${ic('sparkle','stroke:#fff')}Повторить</button></div>`;
v.querySelector('#rt').onclick=()=>{S.tab='create';shell()}}

const runningJobs=new Set();
function updateJob(job,patch){Object.assign(job,patch,{updatedAt:Date.now()});save();updateJobView(job);if(S.tab==='lib'&&!S.curJobId)lib();}
async function startOrResumeJob(job){
 if(runningJobs.has(job.localId))return;runningJobs.add(job.localId);
 try{
  let client,account,gen;
  if(job.generationId){
   account=POOL.data.accounts.find(a=>a.email===job.accountEmail);
   if(!account)throw new ApiError('Не найдена сессия генерации. Откройте профиль и проверьте подключение.',{code:'AUTH'});
   client=await POOL.prepareClient(account);if(!client)throw new ApiError('Не удалось восстановить сессию генерации',{code:'AUTH'});
   client.key=account.email;
  }else{
   updateJob(job,{status:'starting',statusLabel:'Подключаемся к серверу…',message:'Подключаемся к серверу…',progress:5});
   const got=await POOL.acquire();client=got.client;account=got.account;
   gen=job.type==='edit'?await client.editVideo({prompt:job.prompt,sourceVideoUrl:job.sourceVideoUrl||'',sourceVideo:job.sourceVideo||'',referenceImages:job.referenceImages||[]}):await client.generateVideo({prompt:job.prompt,model:job.model,duration:job.duration,resolution:job.resolution,aspectRatio:job.aspectRatio,audio:job.audio,referenceImages:job.referenceImages||[]});
   if(!gen||!gen.id)throw new ApiError('Сервер не вернул id генерации',{code:'HTTP'});
   job.generationId=String(gen.id);job.accountEmail=account.email;job.referenceImages=[];job.sourceVideo='';
   account.cookies=client.toJSON();save();
  }
  updateJob(job,{status:'processing',statusLabel:'Генерируем видео…',message:'Генерируем видео…',progress:Math.max(6,job.progress||8)});
  let fin=null;
  for(;;){
   try{fin=await client.waitFor(job.generationId,{onProgress:st=>{const n=Math.max(0,Math.min(100,Math.round(st.progress||0)));updateJob(job,{status:'processing',progress:Math.max(6,n),message:n<12?'Разбираем описание':n<40?'Строим сцену и свет':n<85?'Генерируем кадры':'Собираем видео'});}});break;}
   catch(err){if(err&&(['NETWORK','POLL_TIMEOUT'].includes(err.code)||err.status===0)){updateJob(job,{status:'processing',message:'Связь прервалась. Повторяем проверку…'});await sleep(7000);continue;}throw err;}
  }
  const status=String(fin.status||'').toUpperCase();
  if(status==='FAILED'||status==='CANCELLED')throw new ApiError(String(fin.errorMessage||fin.error||'Генерация не удалась'),{code:'GENERATION_FAILED'});
  const url=pickMediaUrl(fin);if(!url)throw new ApiError('Сервер завершил задачу, но не вернул ссылку на видео',{code:'NO_RESULT_URL'});
  let credits=account?account.credits:null;try{credits=(await client.me()).credits}catch(e){}if(account)POOL.release(account,{credits,used:gen&&gen.creditsUsed!=null?gen.creditsUsed:null});
  const item={id:job.generationId,p:job.prompt,r:job.aspectRatio,d:job.duration,res:job.resolution,url,audio:job.audio,saved:false,ts:Date.now(),model:job.model};
  S.lib=S.lib.filter(x=>String(x.id)!==String(item.id));S.lib.unshift(item);
  updateJob(job,{status:'completed',statusLabel:'Готово',message:'Видео готово',progress:100,url,completedAt:Date.now()});
  const fname='DelzAI-'+new Date().toISOString().replace(/[:.]/g,'-').slice(0,19)+'.mp4';
  saveVideoToGallery(url,fname).then(r=>{item.saved=!!r.ok;if(r.ok)item.file=r.name;save();if(r.ok)toast('Видео сохранено в Галерею · Movies/DelzAI')});
 }catch(e){
  updateJob(job,{status:'failed',statusLabel:'Ошибка',message:cleanMsg(e&&e.message||'Не удалось создать видео'),error:cleanMsg(e&&e.message||'Ошибка генерации')});

function me(){
const v=document.getElementById('v');
v.innerHTML=`<h1 style="font-size:32px">Профиль</h1><div class="pro"><div class="av">O</div>
<div><div style="font-weight:600;font-size:17px">Гость</div><div style="color:var(--mute);font-size:14px">Аккаунт не нужен</div></div></div>
<div class="pro" style="justify-content:space-between"><span>Видео в архиве</span><b class="serif" style="font-size:24px">${S.lib.length}</b></div>
<div class="pro" style="flex-direction:column;align-items:stretch;gap:10px">
<div style="display:flex;justify-content:space-between;align-items:center"><span style="font-weight:600">Генерация</span><span style="color:var(--mute);font-size:13px">DelzSeed2.0</span></div>
<div style="display:flex;gap:10px"><div style="flex:1;background:var(--field);border-radius:14px;padding:10px 12px"><div style="font-size:12px;color:var(--mute)">Лимит</div><b class="serif" style="font-size:22px;color:#16A34A">Безлимит</b></div>
<div style="flex:1;background:var(--field);border-radius:14px;padding:10px 12px"><div style="font-size:12px;color:var(--mute)">Оплата</div><b class="serif" style="font-size:22px;color:#16A34A">0 ₽</b></div></div>
<p style="margin:2px 0 0;font-size:13px;color:var(--mute);line-height:1.5">Создавай ролики сколько угодно — без счётчиков, платежей и ограничений.</p></div>
<div class="pro" style="flex-direction:column;align-items:stretch;gap:10px">
<div style="display:flex;justify-content:space-between;align-items:center"><span style="font-weight:600">Подключение</span><span style="color:var(--mute);font-size:13px" id="dst">не проверено</span></div>
<button class="out" id="dchk" style="margin-top:2px">Проверить подключение</button>
<p id="dres" style="display:none;margin:0;font-size:13px;white-space:pre-wrap;word-break:break-word"></p></div>
<button class="out" id="lo">Сбросить приложение</button>`;
v.querySelector('#dchk').onclick=async()=>{
const b=v.querySelector('#dchk'),st=document.getElementById('dst'),res=document.getElementById('dres');
b.disabled=true;b.textContent='Проверяю…';st.textContent='проверяю…';res.style.display='none';
const t0=Date.now();
const r=await bhttp({key:'diag',method:'GET',url:BASE+'/api/auth/csrf',timeoutMs:20000});
const ms=Date.now()-t0;
res.style.display='block';
if(r.status>=200&&r.status<500){st.textContent='онлайн · '+ms+' мс';res.style.color='#16A34A';
res.textContent='Связь установлена за '+ms+' мс. Сервис работает.'}
else if(r.status>0){st.textContent='HTTP '+r.status;res.style.color='#B45309';res.textContent='Сервис ответил ошибкой HTTP '+r.status+' за '+ms+' мс'}
else{st.textContent='офлайн';res.style.color='#D9381E';res.textContent='Нет связи. Проверьте интернет и попробуйте позже.'}
b.disabled=false;b.textContent='Проверить подключение'};
v.querySelector('#lo').onclick=()=>{S.user=null;S.lib=[];S.jobs=[];try{localStorage.removeItem('oa_jobs');localStorage.removeItem('oa_sess')}catch(e){}try{localStorage.removeItem('oa_pool')}catch(e){}POOL.data={cursor:0,accounts:[]};S.tab='create';S.cur=null;S.user={name:'Гость',email:''};save();shell();toast('Приложение сброшено')}}
/* аккаунты живут в пуле oa_pool — единственном хранилище; сессии и их шифрование больше не нужны */
shell();
resumeJobs();
window.addEventListener('focus',resumeJobs);document.addEventListener('visibilitychange',()=>{if(!document.hidden)resumeJobs()});
